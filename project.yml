# 工程已提交为 .xcodeproj，此文件仅用于开发者按需重新生成。
name: AuroraFlow
options:
  bundleIdPrefix: com.auroraflow
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CLANG_ENABLE_MODULES: YES
targets:
  AuroraFlow:
    type: application
    platform: macOS
    sources:
      - path: AuroraFlow
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auroraflow.demo
        INFOPLIST_FILE: AuroraFlow/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        Release:
          MTL_ENABLE_DEBUG_INFO: NO
    scheme:
      gatherCoverageData: false
      run:
        config: Debug
